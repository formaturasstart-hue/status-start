name: Vigia
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      teste:
        description: "Só mandar um e-mail de teste (não grava nada)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: vigia
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Testar serviços
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          ALERTA_EMAIL: ${{ secrets.ALERTA_EMAIL }}
          VIGIA_TESTE: ${{ inputs.teste }}
          VIGIA_ENTREGADOR: ${{ vars.VIGIA_ENTREGADOR }}
        run: node scripts/vigia.mjs
      - name: Salvar histórico
        run: |
          if [ -n "$(git status --porcelain dados)" ]; then
            git config user.name "vigia-start"
            git config user.email "vigia@users.noreply.github.com"
            git add dados
            git commit -m "vigia: atualiza status" -q
            git push -q
          fi
